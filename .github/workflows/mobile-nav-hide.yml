name: Apply mobile nav hide

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-nav-hide.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  TARGET_FILE: index.html
  WORKFLOW_FILE: .github/workflows/mobile-nav-hide.yml

jobs:
  patch-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Apply mobile nav hide patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text()

          old_css = """nav{\n  position:sticky;top:0;z-index:100;\n  background:rgba(244,241,234,.88);\n  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);\n  border-bottom:1px solid var(--line);\n}\n.nav-inner{"""
          new_css = """nav{\n  position:sticky;top:0;z-index:100;\n  background:rgba(244,241,234,.88);\n  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);\n  border-bottom:1px solid var(--line);\n  transition:transform .24s cubic-bezier(.22,1,.36,1);\n  will-change:transform;\n}\n@media(max-width:760px){\n  nav.mobile-nav-hidden{transform:translateY(-100%);}\n}\n.nav-inner{"""
          if 'nav.mobile-nav-hidden{transform:translateY(-100%);}' not in text:
              text = text.replace(old_css, new_css, 1)

          old_js = """function $(id){return document.getElementById(id);}\nfunction toast(msg){\n  const t = $('toast'); t.textContent = msg || 'Done ✓';\n  t.classList.add('show');\n  setTimeout(()=>t.classList.remove('show'), 2200);\n}\n\n// Returns true only if the lead was actually delivered to the n8n webhook."""
          new_js = """function $(id){return document.getElementById(id);}\nfunction toast(msg){\n  const t = $('toast'); t.textContent = msg || 'Done ✓';\n  t.classList.add('show');\n  setTimeout(()=>t.classList.remove('show'), 2200);\n}\n\n/* ── MOBILE NAV — hide while scrolling down on phones ── */\n(function mobileNavHide(){\n  const nav = document.querySelector('nav');\n  const mq = matchMedia('(max-width: 760px)');\n  if (!nav) return;\n\n  let lastY = window.scrollY || 0;\n  let ticking = false;\n\n  function update(){\n    const y = window.scrollY || 0;\n    const delta = y - lastY;\n\n    if (!mq.matches || y < 24 || delta < -6) {\n      nav.classList.remove('mobile-nav-hidden');\n    } else if (delta > 6) {\n      nav.classList.add('mobile-nav-hidden');\n    }\n\n    lastY = y;\n    ticking = false;\n  }\n\n  function onScroll(){\n    if (!ticking) {\n      requestAnimationFrame(update);\n      ticking = true;\n    }\n  }\n\n  window.addEventListener('scroll', onScroll, { passive: true });\n  mq.addEventListener('change', () => nav.classList.remove('mobile-nav-hidden'));\n})();\n\n// Returns true only if the lead was actually delivered to the n8n webhook."""
          if 'function mobileNavHide()' not in text:
              text = text.replace(old_js, new_js, 1)

          required = [
              'nav.mobile-nav-hidden{transform:translateY(-100%);}',
              'function mobileNavHide()',
              "window.addEventListener('scroll', onScroll, { passive: true });",
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'Missing expected patch content: {missing}')

          path.write_text(text)
          PY

      - name: Remove temporary workflow
        run: rm -f "$WORKFLOW_FILE"

      - name: Commit site patch
        run: |
          git config user.name "hatchy-agent"
          git config user.email "hatchy-agent@users.noreply.github.com"
          git add index.html "$WORKFLOW_FILE"
          git commit -m "fix: hide mobile nav while scrolling"
          git push origin HEAD:main

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
