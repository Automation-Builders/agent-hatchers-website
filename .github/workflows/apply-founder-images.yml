          js = """/* ── FOUNDER SPOTLIGHT ── */
(function founderSpotlight(){
  const cards = document.querySelectorAll('.founder-card');
  const panels = document.querySelectorAll('[data-founder-copy]');
  if (!cards.length || !panels.length) return;

  function showFounder(key){
    cards.forEach(card => {
      const active = card.dataset.founder === key;
      card.classList.toggle('is-active', active);
      card.setAttribute('aria-pressed', active ? 'true' : 'false');
    });
    panels.forEach(panel => { panel.hidden = panel.dataset.founderCopy !== key; });
  }

  cards.forEach(card => {
    card.addEventListener('click', () => showFounder(card.dataset.founder));
    card.addEventListener('mouseenter', () => showFounder(card.dataset.founder));
  });
})();

"""
