name: Apply founder image spotlight

on:
  push:
    branches: [hatchy-founder-images]
    paths:
      - .github/workflows/apply-founder-images.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hatchy-founder-images
      - name: Apply founder image spotlight patch
