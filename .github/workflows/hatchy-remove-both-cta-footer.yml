name: Hatchy remove CTA paragraph and footer mark

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hatchy-remove-both-cta-footer.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove requested CTA/footer elements
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          html = path.read_text()
          targets = [
              '    <p class="reveal">Thirty minutes with Noah. He\'ll show you Hermes live, work out which agents fit your business, and give you a price on the spot. No jargon, no pressure.</p>\n',
              '  <div class="footer-mark" aria-hidden="true">Agent Hatching</div>\n',
          ]
          for target in targets:
              if target not in html:
                  raise SystemExit(f'Missing expected target: {target!r}')
              html = html.replace(target, '', 1)
          path.write_text(html)
          PY
      - name: Remove temporary workflow
        run: rm .github/workflows/hatchy-remove-both-cta-footer.yml
      - name: Commit source cleanup
        run: |
          git config user.name 'hatchy-agent'
          git config user.email 'hatchy-agent@users.noreply.github.com'
          git add index.html .github/workflows/hatchy-remove-both-cta-footer.yml
          git commit -m 'Remove final CTA paragraph and footer mark'
          git push
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
