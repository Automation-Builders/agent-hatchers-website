name: Add robot pack once

on:
  push:
    branches:
      - hatchy-slack-teams-security
    paths:
      - .github/workflows/add-robot-pack-once.yml

permissions:
  contents: write

jobs:
  publish-robot-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hatchy-slack-teams-security
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pillow
      - name: Generate transparent robot PNG pack
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw
          from pathlib import Path
          import json, random, math
          out = Path('assets/robot-pack')
          out.mkdir(parents=True, exist_ok=True)
          tools = ['wrench','hammer','paintbrush','laptop','screwdriver','magnifier','pencil','tablet','camera','microphone','rocket','net','lantern','key','shield','watering-can','needle','map','gem','spanner']
          emotions = ['happy','excited','sleepy','curious','angry','sad','surprised','focused','proud','confused']
          clothes = ['cape','scarf','hoodie','lab-coat','jacket','vest','poncho','bowtie','apron','utility-belt']
          accessories = ['antenna','hat','goggles','backpack','headphones','crown','flower','glasses','badge','bandana']
          sizes = [(512,512),(640,640),(768,768),(512,640),(640,512),(720,600),(600,720),(900,720),(720,900),(800,800)]
          palettes = [((245,96,71),(255,190,82),(91,54,101)),((49,145,227),(102,232,209),(31,68,117)),((73,184,112),(205,238,121),(42,93,71)),((153,93,230),(242,151,255),(64,51,126)),((247,200,70),(255,132,78),(117,77,35)),((237,86,145),(255,182,193),(112,49,81)),((55,207,172),(191,255,214),(28,101,99)),((109,128,163),(208,218,235),(52,58,85)),((111,66,193),(255,97,136),(53,38,94)),((75,170,255),(239,250,255),(30,89,147))]
          def rgba(c): return c + (255,)
          def rr(d,b,r,f,o=None,w=1): d.rounded_rectangle(b, radius=r, fill=f, outline=o, width=w)
          def poly(d,pts,f,o,w):
              d.polygon(pts, fill=f)
              d.line(pts+[pts[0]], fill=o, width=w, joint='curve')
          def draw_tool(d,t,x,y,s,dark,accent):
              w=max(3,int(s*.08))
              if t in ('wrench','spanner'):
                  d.line([(x,y),(x+s*.5,y-s*.5)],fill=dark,width=w)
                  d.ellipse((x+s*.38,y-s*.64,x+s*.68,y-s*.34),outline=dark,width=w)
              elif t=='hammer':
                  d.line([(x,y),(x+s*.42,y-s*.42)],fill=dark,width=w)
                  rr(d,(x+s*.25,y-s*.62,x+s*.65,y-s*.43),int(s*.04),dark)
              elif t=='paintbrush':
                  d.line([(x,y),(x+s*.48,y-s*.48)],fill=dark,width=w)
                  poly(d,[(x+s*.48,y-s*.48),(x+s*.68,y-s*.68),(x+s*.77,y-s*.48),(x+s*.58,y-s*.38)],accent,dark,max(2,w//2))
              elif t=='laptop':
                  rr(d,(x+s*.03,y-s*.53,x+s*.58,y-s*.14),int(s*.04),(235,244,252,255),dark,max(2,w//2)); rr(d,(x,y-s*.13,x+s*.64,y-s*.03),int(s*.03),dark)
              elif t=='screwdriver':
                  d.line([(x,y),(x+s*.55,y-s*.55)],fill=dark,width=max(2,w//2)); rr(d,(x-s*.05,y-s*.02,x+s*.17,y+s*.1),int(s*.04),accent,dark,max(2,w//2))
              elif t=='magnifier':
                  d.ellipse((x+s*.16,y-s*.58,x+s*.58,y-s*.16),outline=dark,width=w); d.line([(x+s*.48,y-s*.26),(x+s*.72,y-s*.02)],fill=dark,width=w)
              elif t in ('pencil','needle'):
                  poly(d,[(x,y),(x+s*.12,y+s*.04),(x+s*.68,y-s*.52),(x+s*.56,y-s*.60)],accent,dark,max(2,w//2)); poly(d,[(x+s*.56,y-s*.60),(x+s*.77,y-s*.72),(x+s*.68,y-s*.52)],(255,232,167,255),dark,max(2,w//2))
              elif t=='tablet':
                  rr(d,(x+s*.04,y-s*.62,x+s*.53,y-s*.08),int(s*.07),(246,249,255,255),dark,max(2,w//2))
              elif t=='camera':
                  rr(d,(x+s*.02,y-s*.50,x+s*.60,y-s*.13),int(s*.06),accent,dark,max(2,w//2)); d.ellipse((x+s*.2,y-s*.43,x+s*.43,y-s*.2),fill=(245,250,255,255),outline=dark,width=max(2,w//2))
              elif t=='microphone':
                  rr(d,(x+s*.22,y-s*.58,x+s*.46,y-s*.25),int(s*.12),accent,dark,max(2,w//2)); d.line([(x+s*.34,y-s*.25),(x+s*.34,y-s*.02)],fill=dark,width=w)
              elif t=='rocket':
                  poly(d,[(x+s*.2,y-s*.1),(x+s*.55,y-s*.62),(x+s*.72,y-s*.45),(x+s*.38,y-s*.02)],accent,dark,max(2,w//2)); d.ellipse((x+s*.48,y-s*.45,x+s*.60,y-s*.33),fill=(240,252,255,255),outline=dark,width=max(2,w//2))
              elif t=='net':
                  d.ellipse((x+s*.18,y-s*.66,x+s*.62,y-s*.22),outline=dark,width=w); d.line([(x+s*.28,y-s*.28),(x,y)],fill=dark,width=w)
              elif t=='lantern':
                  rr(d,(x+s*.15,y-s*.55,x+s*.55,y-s*.10),int(s*.07),(255,220,103,255),dark,max(2,w//2)); d.line([(x+s*.22,y-s*.55),(x+s*.22,y-s*.70),(x+s*.48,y-s*.70),(x+s*.48,y-s*.55)],fill=dark,width=max(2,w//2))
              elif t=='key':
                  d.ellipse((x+s*.18,y-s*.48,x+s*.43,y-s*.23),outline=dark,width=w); d.line([(x+s*.38,y-s*.28),(x+s*.75,y-s*.65)],fill=dark,width=w)
              elif t=='shield':
                  poly(d,[(x+s*.18,y-s*.62),(x+s*.62,y-s*.52),(x+s*.55,y-s*.12),(x+s*.40,y+s*.05),(x+s*.23,y-s*.12)],accent,dark,max(2,w//2))
              elif t=='watering-can':
                  rr(d,(x+s*.08,y-s*.45,x+s*.52,y-s*.12),int(s*.06),accent,dark,max(2,w//2)); d.line([(x+s*.52,y-s*.34),(x+s*.76,y-s*.49)],fill=dark,width=w)
              elif t=='map':
                  poly(d,[(x,y-s*.5),(x+s*.22,y-s*.62),(x+s*.44,y-s*.5),(x+s*.66,y-s*.62),(x+s*.66,y-s*.14),(x+s*.44,y-s*.02),(x+s*.22,y-s*.14),(x,y-s*.02)],(245,239,204,255),dark,max(2,w//2))
              else:
                  poly(d,[(x+s*.35,y-s*.65),(x+s*.64,y-s*.46),(x+s*.55,y-s*.12),(x+s*.18,y-s*.10),(x+s*.08,y-s*.45)],accent,dark,max(2,w//2))
          manifest=[]
          for i in range(100):
              rnd=random.Random(1000+i); W,H=sizes[i%10]
              im=Image.new('RGBA',(W,H),(0,0,0,0)); d=ImageDraw.Draw(im)
              primary,secondary,dark=map(rgba,palettes[i%10])
              tool=tools[i%20]; emotion=emotions[(i//2)%10]; cloth=clothes[(i//3)%10]; acc=accessories[(i//5)%10]
              sc=min(W,H)/512; cx=W/2+rnd.uniform(-18,18)*sc; cy=H*.53+rnd.uniform(-12,12)*sc
              hw=rnd.uniform(175,225)*sc; hh=rnd.uniform(135,185)*sc; bw=rnd.uniform(150,215)*sc; bh=rnd.uniform(120,190)*sc; ow=max(5,int(7*sc))
              if i%4==0:
                  poly(d,[(cx-hw*.35,cy-hh*.92),(cx-hw*.55,cy-hh*.65),(cx-hw*.25,cy-hh*.70)],secondary,dark,ow); poly(d,[(cx+hw*.35,cy-hh*.92),(cx+hw*.55,cy-hh*.65),(cx+hw*.25,cy-hh*.70)],secondary,dark,ow)
              for side in [-1,1]:
                  lx=cx+side*bw*.22; ly=cy+bh*.60
                  rr(d,(lx-22*sc,ly,lx+22*sc,ly+62*sc),int(15*sc),primary,dark,ow)
                  d.ellipse((lx-38*sc,ly+48*sc,lx+38*sc,ly+80*sc),fill=secondary,outline=dark,width=ow)
                  hand=(cx+side*(bw*.70+rnd.uniform(10,35)*sc), cy+rnd.uniform(-8,38)*sc)
                  d.line([(cx+side*bw*.48,cy+bh*.02),hand],fill=dark,width=max(9,int(13*sc)))
                  d.ellipse((hand[0]-18*sc,hand[1]-18*sc,hand[0]+18*sc,hand[1]+18*sc),fill=secondary,outline=dark,width=max(3,int(4*sc)))
              rr(d,(cx-bw/2,cy-bh*.12,cx+bw/2,cy+bh*.78),int(38*sc),primary,dark,ow)
              rr(d,(cx-bw*.25,cy+bh*.10,cx+bw*.25,cy+bh*.42),int(16*sc),(245,249,255,255),dark,max(3,int(4*sc)))
              if cloth=='cape': poly(d,[(cx-bw*.52,cy-bh*.05),(cx-bw*.82,cy+bh*.86),(cx+bw*.70,cy+bh*.82),(cx+bw*.52,cy-bh*.05)],secondary,dark,max(3,int(4*sc)))
              elif cloth=='scarf': rr(d,(cx-bw*.43,cy-bh*.16,cx+bw*.43,cy-bh*.02),int(12*sc),secondary,dark,max(3,int(4*sc)))
              elif cloth=='lab-coat': d.line([(cx,cy-bh*.08),(cx,cy+bh*.72)],fill=(255,255,255,255),width=max(6,int(8*sc)))
              elif cloth=='utility-belt': rr(d,(cx-bw*.47,cy+bh*.45,cx+bw*.47,cy+bh*.58),int(8*sc),dark)
              elif cloth=='bowtie': poly(d,[(cx,cy-bh*.05),(cx-35*sc,cy-bh*.20),(cx-35*sc,cy+bh*.07)],secondary,dark,max(2,int(3*sc))); poly(d,[(cx,cy-bh*.05),(cx+35*sc,cy-bh*.20),(cx+35*sc,cy+bh*.07)],secondary,dark,max(2,int(3*sc)))
              else: rr(d,(cx-bw*.36,cy+bh*.46,cx+bw*.36,cy+bh*.62),int(10*sc),secondary,dark,max(3,int(4*sc)))
              rr(d,(cx-hw/2,cy-hh*.88,cx+hw/2,cy-hh*.02),int(rnd.uniform(35,55)*sc),(238,247,255,255),dark,ow)
              rr(d,(cx-hw*.39,cy-hh*.68,cx+hw*.39,cy-hh*.24),int(24*sc),primary,dark,max(4,int(5*sc)))
              ey=cy-hh*.48; ex=hw*.18; er=rnd.uniform(10,16)*sc
              if emotion in ('happy','excited','proud'):
                  d.arc((cx-ex-er,ey-er,cx-ex+er,ey+er),20,160,fill=(255,255,255,255),width=max(3,int(4*sc))); d.arc((cx+ex-er,ey-er,cx+ex+er,ey+er),20,160,fill=(255,255,255,255),width=max(3,int(4*sc)))
              elif emotion=='sleepy':
                  d.line([(cx-ex-er,ey),(cx-ex+er,ey)],fill=(255,255,255,255),width=max(3,int(4*sc))); d.line([(cx+ex-er,ey),(cx+ex+er,ey)],fill=(255,255,255,255),width=max(3,int(4*sc)))
              else:
                  d.ellipse((cx-ex-er,ey-er,cx-ex+er,ey+er),fill=(255,255,255,255),outline=dark,width=max(2,int(2*sc))); d.ellipse((cx+ex-er,ey-er,cx+ex+er,ey+er),fill=(255,255,255,255),outline=dark,width=max(2,int(2*sc)))
              my=cy-hh*.31
              if emotion in ('sad','confused'): d.arc((cx-28*sc,my-2*sc,cx+28*sc,my+35*sc),200,340,fill=(255,255,255,255),width=max(3,int(4*sc)))
              elif emotion=='angry': d.line([(cx-25*sc,my),(cx+25*sc,my-8*sc)],fill=(255,255,255,255),width=max(3,int(4*sc)))
              elif emotion=='surprised': d.ellipse((cx-13*sc,my-8*sc,cx+13*sc,my+20*sc),fill=(255,255,255,255))
              else: d.arc((cx-32*sc,my-22*sc,cx+32*sc,my+18*sc),20,160,fill=(255,255,255,255),width=max(3,int(4*sc)))
              if acc=='hat': rr(d,(cx-hw*.30,cy-hh*1.08,cx+hw*.30,cy-hh*.84),int(18*sc),secondary,dark,ow)
              elif acc in ('goggles','glasses'):
                  for sgn in [-1,1]: d.ellipse((cx+sgn*ex-24*sc,ey-20*sc,cx+sgn*ex+24*sc,ey+20*sc),outline=(255,255,255,255),width=max(3,int(4*sc)))
              elif acc=='headphones': d.arc((cx-hw*.46,cy-hh*.76,cx+hw*.46,cy-hh*.20),195,345,fill=dark,width=max(5,int(6*sc)))
              elif acc=='crown': poly(d,[(cx-hw*.28,cy-hh*.86),(cx-hw*.20,cy-hh*1.05),(cx,cy-hh*.88),(cx+hw*.20,cy-hh*1.05),(cx+hw*.28,cy-hh*.86)],(255,211,70,255),dark,max(3,int(4*sc)))
              elif acc=='flower':
                  for a in range(6): d.ellipse((cx+hw*.35+math.cos(a*math.tau/6)*18*sc-11*sc,cy-hh*.92+math.sin(a*math.tau/6)*18*sc-11*sc,cx+hw*.35+math.cos(a*math.tau/6)*18*sc+11*sc,cy-hh*.92+math.sin(a*math.tau/6)*18*sc+11*sc),fill=secondary,outline=dark,width=max(1,int(2*sc)))
              elif acc=='badge': d.ellipse((cx+bw*.23,cy+bh*.16,cx+bw*.38,cy+bh*.31),fill=(255,228,86,255),outline=dark,width=max(2,int(3*sc)))
              elif acc=='backpack': rr(d,(cx-bw*.68,cy+bh*.04,cx-bw*.48,cy+bh*.54),int(16*sc),secondary,dark,max(3,int(4*sc)))
              elif acc=='bandana': rr(d,(cx-hw*.42,cy-hh*.74,cx+hw*.42,cy-hh*.62),int(8*sc),secondary,dark,max(2,int(3*sc)))
              draw_tool(d, tool, cx+(1 if i%2==0 else -1)*bw*.62, cy+bh*.14, 86*sc, dark, secondary)
              for sgn in [-1,1]: d.ellipse((cx+sgn*hw*.29-8*sc,cy-hh*.38-6*sc,cx+sgn*hw*.29+8*sc,cy-hh*.38+6*sc),fill=secondary)
              name=f'robot-{i+1:03d}-{emotion}-{tool}-{cloth}-{acc}-{W}x{H}.png'
              im.save(out/name, optimize=True)
              manifest.append({'file':name,'size':[W,H],'tool':tool,'emotion':emotion,'clothes':cloth,'accessory':acc})
          (out/'manifest.json').write_text(json.dumps(manifest, indent=2))
          PY
      - name: Commit pack and remove one-shot workflow
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          imgs = sorted(Path('assets/robot-pack').glob('robot-*.png'))
          assert len(imgs) == 100, len(imgs)
          for f in imgs:
              im = Image.open(f)
              assert im.mode == 'RGBA', (f, im.mode)
              assert im.getchannel('A').getextrema()[0] == 0, f
          assert Path('assets/robot-pack/manifest.json').exists()
          PY
          rm .github/workflows/add-robot-pack-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/robot-pack .github/workflows/add-robot-pack-once.yml
          git commit -m "feat: add robot sprite pack"
          git push
