name: Deploy login button update

on:
  push:
    paths:
      - '.github/workflows/deploy-login-button-update.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify login button and remove this workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text()
          assert html.count('href="http://agenthatchers.ai"') == 1
          assert html.count('>Login</a>') == 1
          Path('.github/workflows/deploy-login-button-update.yml').unlink(missing_ok=True)
          PY
      - name: Commit workflow removal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/deploy-login-button-update.yml
          git commit -m "chore: remove login deploy workflow" || true
          git push origin main
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
