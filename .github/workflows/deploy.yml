# Agent Hatchers  |  https://agenthatchers.com
#
# The public marketing site. Plain static HTML with no build step: GitHub Pages
# serves the repo root, so every file committed here is published as-is. Keep
# internal material out of this repo entirely — there is no private directory.
#
# The custom domain is pinned by CNAME; a deploy that drops that file takes the
# domain down with it.

name: Deploy to GitHub Pages

# Static site (vanilla index.html). Every push to main publishes to GitHub Pages,
# which serves it at the custom domain agenthatchers.com (see the CNAME file).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Least-privilege permissions required by the Pages deploy action.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Publish the repo root. This repo holds only the public site, so
          # there is nothing here that shouldn't be served.
          path: '.'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
