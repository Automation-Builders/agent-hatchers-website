name: Add login button

on:
  push:
    paths:
      - '.github/workflows/add-login-button.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  LOGIN_URL: http://agenthatchers.ai

jobs:
  patch-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Add login button to nav
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old_css = ".nav-links a:hover{color:var(--accent);}\n.nav-cta .btn{min-height:42px;padding:0 22px;font-size:14px;}\n@media(max-width:860px){.nav-links{display:none;}}\n@media(max-width:480px){"
          new_css = ".nav-links a:hover{color:var(--accent);}\n.nav-cta{display:flex;align-items:center;gap:10px;}\n.nav-cta .btn{min-height:42px;padding:0 22px;font-size:14px;}\n@media(max-width:860px){.nav-links{display:none;}}\n@media(max-width:560px){.nav-cta .book-call{display:none;}}\n@media(max-width:480px){"
          old_html = '    <div class="nav-cta">\n      <a href="#book" class="btn btn-primary" data-open-book>Book a call <span class="arrow">→</span></a>\n    </div>'
          new_html = '    <div class="nav-cta">\n      <a href="http://agenthatchers.ai" class="btn btn-secondary login-link">Login</a>\n      <a href="#book" class="btn btn-primary book-call" data-open-book>Book a call <span class="arrow">→</span></a>\n    </div>'
          if 'href="http://agenthatchers.ai" class="btn btn-secondary login-link"' not in s:
              if old_css not in s:
                  raise SystemExit('expected CSS snippet not found')
              s = s.replace(old_css, new_css, 1)
              if old_html not in s:
                  raise SystemExit('expected nav CTA snippet not found')
              s = s.replace(old_html, new_html, 1)
          workflow = Path('.github/workflows/add-login-button.yml')
          if workflow.exists():
              workflow.unlink()
          p.write_text(s)
          PY
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/add-login-button.yml
          git commit -m "Add nav login button" || exit 0
          git push origin main
      - name: Deploy Pages
        uses: actions/deploy-pages@v4
