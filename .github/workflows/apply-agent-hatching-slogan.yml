name: Apply Agent Hatching slogan update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-agent-hatching-slogan.yml'

permissions:
  contents: write
  pages: write
  id-token: write

environment:
  name: github-pages
  url: ${{ steps.deployment.outputs.page_url }}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  apply-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply slogan copy update
        run: |
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
              Path('index.html'): [
                  ('One agent, one job', 'One agent, job done'),
                  ('One agent, <em>one job.</em>', 'One agent, <em>job done.</em>'),
              ],
              Path('llms.txt'): [
                  ('one agent per job (sales, documents, invoices, website)', 'one agent, job done (sales, documents, invoices, website)'),
              ],
          }
          for path, reps in replacements.items():
              text = path.read_text()
              for old, new in reps:
                  text = text.replace(old, new)
              path.write_text(text)
          PY

      - name: Remove one-shot workflow
        run: rm .github/workflows/apply-agent-hatching-slogan.yml

      - name: Commit update to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html llms.txt .github/workflows/apply-agent-hatching-slogan.yml
          git commit -m "Update Agent Hatchers slogan" || echo "No changes to commit"
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
