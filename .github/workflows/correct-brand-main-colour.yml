name: Correct brand main colour

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/correct-brand-main-colour.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Change accent from 2891DF to 216BAC
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          html = path.read_text()
          replacements = {
              'Agent Hatchers blue. Typography does the work.': 'Agent Hatchers main colour. Typography does the work.',
              '#2891DF': '#216BAC',
              '2891df': '216bac',
              '40,145,223': '33,107,172',
          }
          for old, new in replacements.items():
              if old not in html:
                  raise SystemExit(f'missing expected text: {old}')
              html = html.replace(old, new)
          if any(old in html for old in ['#2891DF', '2891df', '40,145,223', '#FF4D00', 'ff4d00', '255,77,0']):
              raise SystemExit('old colour references remain')
          path.write_text(html)
          PY
          rm .github/workflows/correct-brand-main-colour.yml
      - name: Commit and push
        run: |
          git config user.name "hatchy-agent"
          git config user.email "hatchy-agent@users.noreply.github.com"
          git add index.html .github/workflows/correct-brand-main-colour.yml
          git diff --cached --check
          git commit -m "Correct brand main colour"
          git push
