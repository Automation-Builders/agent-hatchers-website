name: One-shot main logo update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-main-logo-update.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-main-logo-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add main logo asset and update references
        shell: bash
        run: |
          set -euo pipefail
          cat > agent-hatchers-main-logo.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="456" height="132" viewBox="0 0 456 132" role="img" aria-label="Agent Hatching">
            <title>Agent Hatching</title>
            <image href="agent-hatchers-logo.png" x="38" y="21" width="90" height="90" preserveAspectRatio="xMidYMid meet"/>
            <text x="160" y="78" fill="#121212" font-family="Baloo 2, Arial Rounded MT Bold, Arial, sans-serif" font-size="39" font-weight="800" letter-spacing="2">AGENT HATCHING</text>
          </svg>
          SVG
          sed -i 's/^          //' agent-hatchers-main-logo.svg

          python3 - <<'PY'
          from pathlib import Path
          main = 'agent-hatchers-main-logo.svg'
          square = 'agent-hatchers-logo.png'

          p = Path('index.html')
          s = p.read_text()
          s = s.replace(square, main)
          s = s.replace(f'<link rel="icon" type="image/png" href="{main}" />', f'<link rel="icon" type="image/png" href="{square}" />')
          s = s.replace('.logo img{width:30px;height:30px;border-radius:6px;object-fit:contain;}', '.logo img{width:190px;height:auto;border-radius:0;object-fit:contain;display:block;}')
          s = s.replace('  .logo span{font-size:12px;}', '  .logo img{width:150px;}')
          s = s.replace('      <img src="agent-hatchers-main-logo.svg" alt="" />\n      <span>Agent&nbsp;Hatching</span>', '      <img src="agent-hatchers-main-logo.svg" alt="Agent Hatching" />')
          p.write_text(s)

          for name in ['audit.html', 'privacy-policy.html', 'terms-of-service.html']:
              p = Path(name)
              s = p.read_text()
              s = s.replace('      <img src="agent-hatchers-logo.png" alt="Agent Hatching" style="width:32px;height:32px;border-radius:9px;object-fit:contain;" />\n      <span>Agent Hatching</span>', '      <img src="agent-hatchers-main-logo.svg" alt="Agent Hatching" style="width:180px;height:auto;border-radius:0;object-fit:contain;" />')
              s = s.replace('      <img src="agent-hatchers-logo.png" alt="Agent Hatching" style="width:28px;height:28px;border-radius:7px;object-fit:contain;" />\n      <span>Agent Hatching</span>', '      <img src="agent-hatchers-main-logo.svg" alt="Agent Hatching" style="width:160px;height:auto;border-radius:0;object-fit:contain;" />')
              p.write_text(s)
          PY

          grep -R "agent-hatchers-main-logo.svg" -n index.html audit.html privacy-policy.html terms-of-service.html agent-hatchers-main-logo.svg
          git rm --quiet .github/workflows/one-shot-main-logo-update.yml

      - name: Commit main logo update and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "hatchy-agent"
          git config user.email "hatchy-agent@users.noreply.github.com"
          git add agent-hatchers-main-logo.svg index.html audit.html privacy-policy.html terms-of-service.html .github/workflows/one-shot-main-logo-update.yml
          git commit -m "Use main Agent Hatching logo"
          git push origin HEAD:main

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
