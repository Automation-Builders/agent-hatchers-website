name: One-shot Agent Hatchers rename

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/oneshot-agent-hatchers-rename.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  rename-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Rename Agent Hatching to Agent Hatchers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = [
              'README.md',
              'audit.html',
              'index.html',
              'llms.txt',
              'privacy-policy.html',
              'terms-of-service.html',
              'agent-hatchers-main-logo.svg',
          ]
          for f in files:
              p = Path(f)
              s = p.read_text()
              s = s.replace('AGENT HATCHING', 'AGENT HATCHERS')
              s = s.replace('Agent&nbsp;Hatching', 'Agent&nbsp;Hatchers')
              s = s.replace('Agent Hatching', 'Agent Hatchers')
              p.write_text(s)
          PY
          rm .github/workflows/oneshot-agent-hatchers-rename.yml
          if git grep -n -i "Agent Hatching"; then
            echo "Old brand string still present" >&2
            exit 1
          fi
      - name: Commit cleanup
        run: |
          git config user.name "hatchy-agent"
          git config user.email "hatchy-agent@users.noreply.github.com"
          git add README.md audit.html index.html llms.txt privacy-policy.html terms-of-service.html agent-hatchers-main-logo.svg .github/workflows/oneshot-agent-hatchers-rename.yml
          git commit -m "fix: rename site metadata to Agent Hatchers"
          git push
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
