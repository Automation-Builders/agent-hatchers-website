<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Prototype sessions · Agent Hatchers</title>
  <link rel="icon" href="/agent-hatchers-mark.png">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#1a1d21;--muted:#6b7480;--line:#e4e8ef;--brand:#216bac;--green:#1a9d5f;--bg:#f5f6f8}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;font-size:14px}
    header{background:#fff;border-bottom:1px solid var(--line);padding:12px clamp(14px,3vw,32px);display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:5}
    header img{width:26px;height:26px;border-radius:7px}header h1{font-size:1.05rem;margin:0;flex:1}
    .key{display:flex;gap:8px;align-items:center}.key input{border:1.5px solid var(--line);border-radius:10px;padding:8px 11px;font:inherit;width:220px}
    .btn{border:0;border-radius:10px;padding:9px 14px;font:600 .88rem Inter,system-ui;cursor:pointer;background:var(--brand);color:#fff}.btn.sec{background:#eef0f3;color:#48505a}.btn.del{color:#a12a2a;background:#fdeeee;padding:6px 10px;font-size:.78rem}
    main{max-width:1240px;margin:0 auto;padding:20px clamp(14px,3vw,32px) 60px}
    .stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px;min-width:130px}.stat b{display:block;font-size:1.4rem}.stat span{color:var(--muted);font-size:.8rem}
    .tools{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}.tools input{border:1.5px solid var(--line);border-radius:10px;padding:8px 11px;font:inherit;width:260px}.tools .n{color:var(--muted);font-size:.85rem}
    .list{display:grid;gap:12px}
    .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;grid-template-columns:76px 1fr auto;gap:14px;align-items:center;cursor:pointer}
    .card:hover{border-color:#c9d6e6;box-shadow:0 8px 24px rgba(20,40,70,.08)}
    .thumb{width:76px;height:76px;border-radius:12px;background:linear-gradient(160deg,#e0edfb,#c8ddf5);display:grid;place-items:center;overflow:hidden;color:#6b7480;font-size:.7rem}.thumb img{width:100%;height:100%;object-fit:cover}
    .title{font-weight:800;font-size:1.02rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.title small{font-weight:600;color:var(--muted)}
    .sub{color:var(--muted);margin-top:3px}.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
    .pill{background:#eef5fc;color:var(--brand);border-radius:999px;padding:3px 9px;font-size:.74rem;font-weight:700}.pill.ok{background:#e8f6ee;color:var(--green)}.pill.grey{background:#f0f2f5;color:#5b6572}.pill.warn{background:#fff4e0;color:#9a6200}
    .when{text-align:right;color:var(--muted);font-size:.82rem;white-space:nowrap}.when b{display:block;color:var(--ink)}
    .detail{grid-column:1/-1;border-top:1px solid var(--line);padding-top:14px;margin-top:4px;display:none;cursor:default}
    .card.open .detail{display:block}
    .detail h4{margin:14px 0 8px;font-size:.82rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
    .row{display:flex;gap:10px;flex-wrap:wrap}.row figure{margin:0;width:110px}.row figure img{width:110px;height:110px;object-fit:cover;border-radius:12px;border:1px solid var(--line);background:#fff}.row figcaption{font-size:.74rem;color:var(--muted);margin-top:4px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;font-size:.9rem}.kv div:nth-child(odd){color:var(--muted)}
    .chat{background:#f7f9fc;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px;font-size:.88rem}.chat b{display:block;margin-bottom:6px}.msg{padding:5px 0;border-top:1px dashed #e4e8ef}.msg:first-of-type{border-top:0}.msg i{font-style:normal;font-weight:700;color:var(--brand);margin-right:6px}.msg.me i{color:var(--green)}
    .prof{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px;display:grid;grid-template-columns:64px 1fr;gap:12px}.prof img{width:64px;height:64px;border-radius:10px;object-fit:cover}.prof ul{margin:6px 0 0;padding-left:18px;font-size:.86rem}
    .empty{padding:40px;text-align:center;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:16px}
    .err{background:#fff0f0;border:1px solid #f3c2c2;color:#8a2323;border-radius:12px;padding:12px 14px;margin-bottom:14px}
    @media(max-width:640px){.card{grid-template-columns:60px 1fr}.when{grid-column:2;text-align:left}.thumb{width:60px;height:60px}}
  </style>
</head>
<body>
<header><img src="/agent-hatchers-mark.png" alt=""><h1>Prototype sessions</h1>
  <form class="key" id="keyform"><input id="key" type="password" placeholder="Sessions key" autocomplete="current-password"><button class="btn" type="submit">Load</button><button class="btn sec" type="button" id="refresh">Refresh</button></form>
</header>
<main>
  <div id="err" class="err" hidden></div>
  <div class="stats" id="stats" hidden></div>
  <div class="tools" id="tools" hidden><input id="q" placeholder="Filter by company, business, agent name…"><span class="n" id="n"></span></div>
  <div class="list" id="list"></div>
  <div class="empty" id="empty">Enter the sessions key to load what prospects have hatched.</div>
</main>
<script>
(()=>{
  const ENDPOINT=(window.SESSIONS_ENDPOINT)||'https://agent-hatchers-portrait-proxy.vercel.app/api/prototype-session';
  const $=id=>document.getElementById(id);
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const STEPS=['Welcome','Team','Create','Hatching','Dashboard','Connect'];
  const AGENT_NAMES={logistics:'Logistics',sales:'Sales',documents:'Documents',invoices:'Invoices',support:'Support',website:'Website',operations:'Operations',marketing:'Marketing',returns:'Returns',inventory:'Inventory'};
  let all=[];const full=new Map();
  const ago=t=>{if(!t)return '';const d=Date.now()-t,m=Math.round(d/60000);if(m<1)return 'just now';if(m<60)return m+' min ago';const h=Math.round(m/60);if(h<48)return h+' h ago';return Math.round(h/24)+' days ago';};
  const fmt=t=>t?new Date(t).toLocaleString('en-AU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'';
  const dur=s=>{if(!s.startedAt||!s.savedAt)return '';const m=Math.round((s.savedAt-s.startedAt)/60000);return m<1?'under a minute':m+' min';};
  try{const k=localStorage.getItem('ah-sessions-key');if(k){$('key').value=k;}}catch(e){}
  $('keyform').onsubmit=e=>{e.preventDefault();load();};$('refresh').onclick=load;
  $('q').oninput=draw;
  async function load(){
    const key=$('key').value.trim();if(!key){$('key').focus();return;}
    try{localStorage.setItem('ah-sessions-key',key);}catch(e){}
    $('err').hidden=true;$('empty').textContent='Loading…';$('empty').hidden=false;$('list').innerHTML='';
    try{
      const r=await fetch(ENDPOINT+'?key='+encodeURIComponent(key),{cache:'no-store'});
      const j=await r.json().catch(()=>({}));
      if(!r.ok){throw new Error(j.error||('HTTP '+r.status));}
      all=j.sessions||[];draw();
    }catch(e){$('err').textContent='Could not load sessions: '+e.message;$('err').hidden=false;$('empty').textContent='Nothing loaded.';}
  }
  function draw(){
    const q=$('q').value.trim().toLowerCase();
    const rows=all.filter(s=>!q||`${s.company} ${s.biz} ${s.name} ${s.industry} ${s.brand}`.toLowerCase().includes(q));
    const hatched=all.filter(s=>s.step>=4).length,profiles=all.reduce((n,s)=>n+(s.profileCount||0),0),chats=all.reduce((n,s)=>n+(s.chatTurns||0),0);
    $('stats').innerHTML=[['Sessions',all.length],['Reached the dashboard',hatched],['Profiles created',profiles],['Chat messages',chats],['Last activity',all[0]?ago(all[0].savedAt):'—']].map(([l,v])=>`<div class="stat"><b>${esc(v)}</b><span>${l}</span></div>`).join('');
    $('stats').hidden=false;$('tools').hidden=false;$('n').textContent=rows.length+' shown';
    $('empty').hidden=rows.length>0;if(!rows.length)$('empty').textContent=all.length?'No sessions match.':'No sessions yet — they appear as soon as a prospect gets past the first screen.';
    $('list').innerHTML=rows.map(card).join('');
    document.querySelectorAll('.card').forEach(el=>el.onclick=e=>{if(e.target.closest('.detail')||e.target.closest('a'))return;toggle(el);});
  }
  function card(s){
    const team=(s.teamIds||[]).map(id=>AGENT_NAMES[id]||id).join(', ');
    return `<article class="card" data-sid="${esc(s.sid)}">
      <div class="thumb">${s.thumb?`<img src="${esc(s.thumb)}" alt="">`:(s.step>=3?'hatching':'no hatch')}</div>
      <div><div class="title">${esc(s.company||'Unnamed company')}${s.name?`<small>· ${esc(s.name)}</small>`:''}</div>
        <div class="sub">${esc(s.biz||'no business typed')}${s.industry?` · ${esc(s.industry)}`:''}${s.brand?` · from ${esc(s.brand)}`:''}</div>
        <div class="pills"><span class="pill ${s.step>=4?'ok':s.step>=3?'':'grey'}">${STEPS[s.step]||'Step '+s.step}${s.step===4&&s.tab?` · ${esc(s.tab)}`:''}</span>${s.done?'<span class="pill ok">Connected</span>':''}${team?`<span class="pill grey">Team: ${esc(team)}</span>`:''}${s.profileCount?`<span class="pill">${s.profileCount} profile${s.profileCount===1?'':'s'} created</span>`:''}${s.chatTurns?`<span class="pill">${s.chatTurns} chat message${s.chatTurns===1?'':'s'}</span>`:''}${s.hadPhoto?'<span class="pill warn">used a photo</span>':''}</div></div>
      <div class="when"><b>${esc(ago(s.savedAt))}</b>${esc(fmt(s.savedAt))}${dur(s)?`<br>${esc(dur(s))} on the page`:''}</div>
      <div class="detail" id="d-${esc(s.sid)}">Loading…</div></article>`;
  }
  async function toggle(el){
    const open=el.classList.toggle('open');if(!open)return;
    const sid=el.dataset.sid,box=el.querySelector('.detail');const meta=all.find(s=>s.sid===sid);
    if(!meta){box.textContent='No detail stored for this session.';return;}
    try{
      let d=full.get(sid);if(!d){const r=await fetch(ENDPOINT+'?key='+encodeURIComponent($('key').value.trim())+'&sid='+encodeURIComponent(sid),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);d=await r.json();full.set(sid,d);}
      box.innerHTML=detail(d);
      box.querySelector('[data-del]').onclick=async()=>{const s=all.find(x=>x.sid===sid);if(!confirm(`Delete the session for ${s?s.company:sid}? This can't be undone.`))return;
        try{const r=await fetch(ENDPOINT+'?key='+encodeURIComponent($('key').value.trim())+'&sid='+encodeURIComponent(sid),{method:'DELETE'});if(!r.ok)throw new Error('HTTP '+r.status);all=all.filter(x=>x.sid!==sid);full.delete(sid);draw();}
        catch(e){alert('Could not delete: '+e.message);}};
    }catch(e){box.textContent='Could not load this session: '+e.message;}
  }
  function detail(d){
    const kv=[['Company',d.company],['Agent name',d.name],['Business',d.biz],['Industry',d.industry],['Look described',d.look],['Website used',d.brand?`${d.brand.name||''} ${d.brand.url||''}`:''],['Reference photo',d.hadPhoto?'yes (not stored)':'no'],['Team intro',d.team&&d.team.intro],['Team source',d.team&&d.team.source],['Redesigns used',d.editUses],['Page',d.page],['Build',d.build],['Browser',d.ua]].filter(([,v])=>v!==undefined&&v!==null&&v!=='').map(([k,v])=>`<div>${esc(k)}</div><div>${esc(v)}</div>`).join('');
    const slots=(d.slots||[]).map((im,i)=>im?`<figure><img src="${esc(im)}" alt=""><figcaption>Design ${i+1}${d.variant===i?' · chosen':''}</figcaption></figure>`:'').join('');
    const market=Object.entries(d.market||{}).map(([id,im])=>`<figure><img src="${esc(im)}" alt=""><figcaption>${esc(AGENT_NAMES[id]||id)}</figcaption></figure>`).join('');
    const team=d.team&&d.team.lines?Object.entries(d.team.lines).map(([id,l])=>`<div class="msg"><i>${esc(AGENT_NAMES[id]||id)}</i>${esc(l.does||'')} <span style="color:#6b7480">— ${esc(l.job||'')}</span></div>`).join(''):'';
    const profiles=(d.profiles||[]).map(p=>`<div class="prof">${p.img?`<img src="${esc(p.img)}" alt="">`:'<div></div>'}<div><b>${esc(p.name)}</b> <span class="pill ${p.status==='deleted'?'grey':'ok'}">${esc(p.status)}</span><div style="color:#6b7480;margin-top:3px">${esc(p.desc||'')}</div>${p.profile?`<ul>${(p.profile.outcomes||[]).map(o=>`<li>${esc(o)}</li>`).join('')}</ul><div style="margin-top:4px;color:#6b7480">Connectors: ${esc((p.profile.mcps||[]).join(', '))} · Team: ${esc(p.profile.team||'')}</div>`:''}</div></div>`).join('');
    const chats=Object.entries(d.chats||{}).filter(([,m])=>Array.isArray(m)&&m.length).map(([i,m])=>`<div class="chat"><b>Chat with ${esc((d.chatNames||[])[i]||('profile '+i))}</b>${m.filter(x=>x[0]!=='typing').map(x=>`<div class="msg ${x[0]==='me'?'me':''}"><i>${x[0]==='me'?'Prospect':x[0]==='pay'?'Paywall':'Agent'}</i>${esc(x[1])}</div>`).join('')}</div>`).join('');
    return `<div class="kv">${kv}</div>
      ${slots?`<h4>Hatched designs</h4><div class="row">${slots}</div>`:''}
      ${team?`<h4>Team we proposed</h4>${team}`:''}
      ${market?`<h4>Marketplace portraits</h4><div class="row">${market}</div>`:''}
      ${profiles?`<h4>Profiles they created</h4>${profiles}`:''}
      ${chats?`<h4>Chats</h4>${chats}`:''}
      <p style="color:#6b7480;font-size:.8rem;margin-top:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap"><span>Session ${esc(d.sid)} · started ${esc(fmt(d.startedAt))} · last saved ${esc(fmt(d.savedAt))}</span><button class="btn sec del" data-del="${esc(d.sid)}" type="button">Delete session</button></p>`;
  }
  if($('key').value)load();
})();
</script>
</body>
</html>
